[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "course-bounded-agent-core"
version = "0.2.0"
description = "A framework-free, bounded and observable Agent teaching project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
course-bounded-agent = "bounded_agent_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bounded_agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.mypy]
python_version = "3.11"
files = ["src/bounded_agent_core"]
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
