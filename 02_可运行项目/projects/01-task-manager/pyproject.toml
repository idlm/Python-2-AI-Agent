[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-task-manager"
version = "0.1.0"
description = "具备受控 JSON 持久化的教学命令行任务管理器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "mypy>=1.10,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
course-tasks = "task_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/task_manager"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
