[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "course-delegation-contract-kit"
version = "0.1.0"
description = "Framework-free contracts for bounded multi-agent delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
course-delegation-contract = "delegation_contract_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delegation_contract_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.mypy]
python_version = "3.11"
files = ["src/delegation_contract_kit"]
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
