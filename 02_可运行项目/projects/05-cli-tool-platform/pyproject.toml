[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-tool-platform"
version = "0.1.0"
description = "《Python私房课》模块 5 的可复现 CLI 工程化骨架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "mypy>=1.10,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
course-env-check = "cli_tool_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
